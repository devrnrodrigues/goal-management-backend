spring:
  application:
    name: goal-management-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/goal_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:sua_senha_aqui}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: "${JWT_SECRET:seu_segredo_jwt_longo_aqui}"
    expiration-hours: 24
